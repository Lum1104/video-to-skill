[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "video-to-skill"
version = "0.1.0"
description = "Compile courses and tutorial videos into grounded, portable Agent Skills."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "video-to-skill contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "pillow>=10.3,<13",
  "platformdirs>=4.2,<5",
  "pydantic>=2.7,<3",
  "typer>=0.12,<1",
  "yt-dlp>=2025.1.1",
]

[project.urls]
Repository = "https://github.com/Lum1104/video-to-skill"

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]
diarization = ["whisperx>=3.3,<4"]
ocr = ["rapidocr>=3.0,<4", "onnxruntime>=1.18,<2"]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "skills-ref>=0.1.1,<1",
]

[project.scripts]
video-to-skill = "video_to_skill.cli:run"

[project.entry-points."video_to_skill.source_adapters"]
local = "video_to_skill.sources:LocalSourceAdapter"
youtube = "video_to_skill.sources:YouTubeSourceAdapter"
bilibili = "video_to_skill.sources:BilibiliSourceAdapter"

[project.entry-points."video_to_skill.transcribers"]
faster-whisper = "video_to_skill.transcript:FasterWhisperTranscriber"
whisperx = "video_to_skill.transcript:WhisperXTranscriber"

[project.entry-points."video_to_skill.ocr_providers"]
rapidocr = "video_to_skill.visual:RapidOCRProvider"

[project.entry-points."video_to_skill.vision_analyzers"]
openai-compatible = "video_to_skill.visual:OpenAICompatibleVisionAnalyzer"

[tool.hatch.build.targets.wheel]
packages = ["src/video_to_skill"]

[tool.hatch.build.targets.wheel.force-include]
"SKILL.md" = "video_to_skill/bundled/SKILL.md"
"scripts/video_to_skill.py" = "video_to_skill/bundled/engine.py"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["video_to_skill"]
